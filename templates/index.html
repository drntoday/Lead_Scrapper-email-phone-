{% extends "base.html" %}

{% block content %}
<div class="row mb-4">
    <div class="col-md-3">
        <div class="card text-white bg-primary">
            <div class="card-body">
                <h5 class="card-title">Total Leads</h5>
                <h2 id="totalLeads">0</h2>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card text-white bg-success">
            <div class="card-body">
                <h5 class="card-title">Verified</h5>
                <h2 id="verifiedLeads">0</h2>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card text-white bg-warning">
            <div class="card-body">
                <h5 class="card-title">Unverified</h5>
                <h2 id="unverifiedLeads">0</h2>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card text-white bg-danger">
            <div class="card-body">
                <h5 class="card-title">Catch-All</h5>
                <h2 id="catchAllLeads">0</h2>
            </div>
        </div>
    </div>
</div>

<div class="row mb-3">
    <div class="col-md-6">
        <div class="btn-group">
            <button class="btn btn-outline-success btn-sm" onclick="exportLeads('csv')">
                <i class="bi bi-download"></i> Export CSV
            </button>
            <button class="btn btn-outline-success btn-sm" onclick="exportLeads('xlsx')">
                <i class="bi bi-file-earmark-excel"></i> Export Excel
            </button>
            <button class="btn btn-outline-success btn-sm" onclick="exportLeads('json')">
                <i class="bi bi-file-earmark-code"></i> Export JSON
            </button>
        </div>
    </div>
    <div class="col-md-6 text-end">
        <span class="text-muted" id="leadCountInfo"></span>
    </div>
</div>

<div class="table-responsive">
    <table class="table table-striped table-hover" id="leadsTable">
        <thead class="table-dark">
            <tr>
                <th>Name</th>
                <th>Company</th>
                <th>Job Title</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Source</th>
                <th>Confidence</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="leadsTableBody">
            <tr>
                <td colspan="8" class="text-center">Loading...</td>
            </tr>
        </tbody>
    </table>
</div>

<nav>
    <ul class="pagination justify-content-center" id="pagination"></ul>
</nav>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
{% endblock %}
