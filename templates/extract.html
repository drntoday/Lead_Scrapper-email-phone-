{% extends "base.html" %}

{% block content %}
<div class="row">
    <div class="col-md-5">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0"><i class="bi bi-search"></i> New Extraction</h5>
            </div>
            <div class="card-body">
                <form id="extractionForm">
                    <div class="mb-3">
                        <label for="sourceType" class="form-label">Source Type</label>
                        <select class="form-select" id="sourceType" required>
                            <option value="">Select source...</option>
                            <option value="google_maps">Google Maps</option>
                            <option value="linkedin">LinkedIn (Public)</option>
                            <option value="directory">Online Directory</option>
                            <option value="website">Company Website</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="searchQuery" class="form-label">Search Query / URL</label>
                        <input type="text" class="form-control" id="searchQuery" 
                               placeholder="e.g., software companies in Mumbai" required>
                    </div>
                    <div class="mb-3">
                        <label for="maxResults" class="form-label">Max Results</label>
                        <input type="number" class="form-control" id="maxResults" 
                               value="50" min="1" max="500">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="bi bi-play-fill"></i> Start Extraction
                    </button>
                </form>
            </div>
        </div>
    </div>
    <div class="col-md-7">
        <div class="card">
            <div class="card-header bg-dark text-white">
                <h5 class="mb-0"><i class="bi bi-terminal"></i> Extraction Log</h5>
            </div>
            <div class="card-body">
                <div id="extractionLog" class="bg-black text-light p-3 rounded" 
                     style="height: 400px; overflow-y: auto; font-family: monospace; font-size: 13px;">
                    <div class="text-muted">Waiting for extraction to start...</div>
                </div>
                <div id="extractionProgress" class="mt-3 d-none">
                    <div class="d-flex justify-content-between mb-1">
                        <span>Progress</span>
                        <span id="progressPercent">0%</span>
                    </div>
                    <div class="progress">
                        <div id="progressBar" class="progress-bar progress-bar-striped progress-bar-animated" 
                             role="progressbar" style="width: 0%"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/extract.js') }}"></script>
{% endblock %}
